---
- name: Install packages
  apt:
    name: "{{ packages }}"
    # update_cache: true
  vars:
    packages:
      - restic
      - moreutils # chronic

- name: Create ~/bin directory
  file:
    path: "~/bin"
    state: directory
    owner: root
    group: root
    mode: "700"

- name: Install repo stats tool
  copy:
    src: restic-repo-stats.py
    dest: ~/bin/restic-repo-stats.py
    owner: root
    group: root
    mode: "700"
  when: restic_backup|default([])|length > 0

- name: Remove old backup scripts
  file:
    path: ~/bin/backup_{{ (item.directory + item.repo)|hash('md5') }}.sh
    state: absent
  when: item.state == 'absent'
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Remove backup scripts
  file:
    path: ~/bin/backup_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    state: absent
  when: item.state == 'absent'
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Install backup scripts
  template:
    src: backup.sh.j2
    dest: ~/bin/backup_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    owner: root
    group: root
    mode: "700"
  when: item.state == 'present'
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Setup cronjobs
  cron:
    name: Backup {{ item.directory }} to {{ item.repo }}
    user: root
    month: "{{ item.cron_month|default(omit) }}"
    weekday: "{{ item.cron_weekday|default(omit) }}"
    day: "{{ item.cron_day|default(omit) }}"
    hour: "{{ item.cron_hour|default(omit) }}"
    minute: "{{ item.cron_minute|default(omit) }}"
    job: >
      {% if item.suppress_mail_on_success|default(True) %}chronic{% endif %}
      ~/bin/backup_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    state: "{{ item.state }}"
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Remove check scripts
  file:
    path: ~/bin/check_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    state: absent
  when: item.state == 'absent' or item.check_cron_hour is not defined
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Install check scripts
  template:
    src: check.sh.j2
    dest: ~/bin/check_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    owner: root
    group: root
    mode: "700"
  when: item.state == 'present' and item.check_cron_hour is defined
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Setup check cronjobs
  cron:
    name: Check {{ item.repo }}
    user: root
    month: "{{ item.check_cron_month|default(omit) }}"
    weekday: "{{ item.check_cron_weekday|default(omit) }}"
    day: "{{ item.check_cron_day|default(omit) }}"
    hour: "{{ item.check_cron_hour|default(omit) }}"
    minute: "{{ item.check_cron_minute|default(omit) }}"
    job: >
      {% if item.suppress_mail_on_success|default(True) %}chronic{% endif %}
      ~/bin/check_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    state: "{{ item.state }}"
  when: item.check_cron_hour is defined
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Remove stats scripts
  file:
    path: ~/bin/stats_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    state: absent
  when: item.state == 'absent'
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Install stats scripts
  template:
    src: stats.sh.j2
    dest: ~/bin/stats_{{ ('restic_' + item.directory + item.repo)|hash('md5') }}.sh
    owner: root
    group: root
    mode: "700"
  when: item.state == 'present'
  with_items: "{{ restic_backup }}"
  loop_control:
    label: "{{ item.repo }}"
